name: releaser

on:
  push:
    # `zig` is the default branch of this repository; `main` is kept for when
    # the branch is renamed back.
    branches: [main, zig]

jobs:
  tag:
    uses: ./.github/workflows/tag.yml
    permissions:
      contents: write

  changelog:
    uses: ./.github/workflows/changelog.yml
    needs: [tag]
    if: needs.tag.outputs.new_version
    permissions:
      contents: write

  build:
    uses: ./.github/workflows/build.yml
    needs: [tag, changelog]
    if: needs.tag.outputs.new_version
    permissions:
      contents: write
    with:
      CHANGELOG: ${{ needs.changelog.outputs.changelog }}
      VERSION: ${{ needs.tag.outputs.new_version }}
